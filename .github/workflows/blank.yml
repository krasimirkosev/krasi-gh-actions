# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true            # tags like v1.2.3
          INITIAL_VERSION: 0.1.0  # used if no tag exists yet
          # Default bump is "minor". You can override via commit message:
          # use "#major" or "#patch" in the commit/merge message.

      - name: Show new tag
        run: echo "New tag is ${{ steps.tag_version.outputs.new_tag }}"

      - name: Build and push Docker image
        if: steps.tag_version.outputs.new_tag != ''
        env:
          VERSION: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          docker build -t my-registry.example.com/my-service:${VERSION} .
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login my-registry.example.com -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
          docker push my-registry.example.com/my-service:${VERSION}